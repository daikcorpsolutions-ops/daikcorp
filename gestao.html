<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Orçamentos — DAIK CORP</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="img/logo.png" />
  <meta name="theme-color" content="#050505" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/gestao.css" />
</head>
<body class="gestao-page">

  <header class="site-header scrolled">
    <a class="brand" href="index.html">
      <img src="img/logo.png" alt="DAIK CORP" class="brand-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline'" />
      <span class="brand-fallback" style="display:none">DAIK<em>CORP</em></span>
    </a>
    <span class="gestao-badge">Painel Interno</span>
  </header>

  <main class="gestao-main">
    <div class="gestao-head">
      <h1>Orçamentos <em class="rubro">recebidos</em></h1>
      <button type="button" class="btn btn-ghost btn-sm" id="btn-atualizar">↻ Atualizar</button>
    </div>

    <div class="gestao-filtros glass">
      <input type="text" id="busca" placeholder="Buscar por nome, código ou WhatsApp..." />
      <select id="filtro-status">
        <option value="">Todos os status</option>
        <option value="Recebido — em análise">Recebido — em análise</option>
        <option value="Em atendimento">Em atendimento</option>
        <option value="Proposta enviada">Proposta enviada</option>
        <option value="Fechado">Fechado</option>
        <option value="Cancelado">Cancelado</option>
      </select>
    </div>

    <p class="gestao-status" id="gestao-status">Carregando orçamentos...</p>

    <div class="gestao-lista" id="gestao-lista"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/gestao.js"></script>
</body>
</html>
